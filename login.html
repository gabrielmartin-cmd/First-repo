<!DOCTYPE html>
<!-- Tells the browser: "this is an HTML document" -->
<html lang="en">
<!-- Opens the HTML document in English language -->

<!-- Made by Gabriel Martín Jiménez & Antonio García Vicente -->

<head>
    <!-- The head: page information (user doesn't see this) -->
    <meta charset="UTF-8">
    <!-- Defines that we use UTF-8 characters (for accents, special characters, etc.) -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Compatibility with older browsers -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page adapts to mobile and tablets -->
    <title>CUNEF FC LOGIN</title>
    <!-- The title that appears in the browser tab -->
    <link rel="stylesheet" href="Styles.css">
</head>

<body>
    <!-- The body: everything visible on the page -->
    <header>
        <!-- The header: logo, title, and navigation menu -->
        <img src="LogoCunefFC.png" alt="CUNEF FC Logo" width="100" height="100">
        <!-- Logo of the page -->
        <h1>LOGIN</h1>
        <!-- Main title -->

    </header>

<main>
    <!-- Main content of the page -->

    <section>
        <!-- Section: Sign-in form -->
        <h2>Sign In to Your Account</h2>
        <!-- Section title -->

        <form>
            <!-- Form: container for input fields -->

        <!-- Email field -->

            <!-- Container for email field -->
            <label for="email">Email:</label>
            <!-- Label associated with email input -->
            <input
                type="email"
                id="email"
                name="email"
                required
            >
            <!-- Email input field (required = must be filled) -->


        <!-- Password field -->

            <!-- Container for password field -->
            <label for="password">Password:</label>
            <!-- Label associated with password input -->
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                required
            >
            <!-- Password input field (minlength = minimum 8 characters, required = must be filled) -->


            <!-- Submit button -->
            <button type="submit">Sign In</button>
            <!-- Button to submit the form (front-end only, doesn't send anywhere yet) -->

        </form>
    </section>

</main>


<footer>
    <!-- Footer: final information -->
    <p>&copy; 2026 CUNEF FC. All rights reserved.</p>
    <!-- Copyright -->
    <a href="https://www.cunef.edu/politica-de-privacidad/">Privacy Policy</a>
     <!-- Link to privacy policy -->
    <strong> | </strong>
    <a href="index.html">Home</a>
    <!-- Link to home page -->
    
</footer>
</body>


</html>
<!-- Closes the HTML document -->
